<!DOCTYPE html>
<html>
<head>
  <title>Sheriff Deed Checker</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #333; }
    .link { margin: 8px 0; }
    a { color: #0066cc; }
    .status { display: inline-block; width: 20px; }
    button { margin: 5px; padding: 8px 16px; cursor: pointer; }
    .found { background: #90EE90; padding: 10px; margin: 10px 0; }
    #results { background: #f5f5f5; padding: 15px; margin: 20px 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🔍 Sheriff Deed Checker</h1>
  <p>Click each link below. If the document says "SHERIFF'S DEED" at the top, click the ✓ button.</p>
  <p><strong>Records to check:</strong> 91 (2026 missed records)</p>
  
  <div id="links"></div>
  
  <h2>Found Sheriff Deeds:</h2>
  <div id="results">None yet - click ✓ when you find one</div>
  
  <script>
    const records = [
      "20260090702","20260090848","20260091069","20260092593","20260093235","20260093355",
      "20260093733","20260094044","20260095690","20260096227","20260096270","20260096909",
      "20260097079","20260097131","20260097326","20260098908","20260099905","20260100185",
      "20260100960","20260101947","20260102485","20260102488","20260102951","20260104580",
      "20260104747","20260104943","20260105344","20260105625","20260105935","20260106524",
      "20260107131","20260107189","20260107606","20260107909","20260108263","20260108267",
      "20260108513","20260108522","20260108578","20260108760","20260109409","20260109410",
      "20260109411","20260110067","20260110546","20260110665","20260110731","20260110735",
      "20260110843","20260111313","20260111314","20260111992","20260112741","20260112747",
      "20260113461","20260115877","20260116715","20260116763","20260116778","20260116861",
      "20260118880","20260119221","20260119390","20260120054","20260121553","20260121554",
      "20260121555","20260121855","20260122773","20260122888","20260123114","20260124411",
      "20260125033","20260125117","20260125331","20260126129","20260127155","20260127468",
      "20260127820","20260128262","20260129072","20260129147","20260129249","20260129267",
      "20260129700","20260130007","20260131806","20260131874","20260132013","20260132290",
      "20260132967"
    ];
    
    const found = [];
    const container = document.getElementById('links');
    const results = document.getElementById('results');
    
    records.forEach((rec, i) => {
      const url = `https://recorder.maricopa.gov/recording/document-preview.html?recordingNumber=${rec}&suffix=&pages=1`;
      const div = document.createElement('div');
      div.className = 'link';
      div.innerHTML = `
        <span class="status" id="status-${rec}">⬜</span>
        <a href="${url}" target="_blank">${i+1}. ${rec}</a>
        <button onclick="markFound('${rec}')">✓ Sheriff Deed</button>
        <button onclick="markNot('${rec}')">✗ Not</button>
      `;
      container.appendChild(div);
    });
    
    function markFound(rec) {
      document.getElementById('status-' + rec).textContent = '✅';
      if (!found.includes(rec)) {
        found.push(rec);
        updateResults();
      }
    }
    
    function markNot(rec) {
      document.getElementById('status-' + rec).textContent = '❌';
    }
    
    function updateResults() {
      if (found.length === 0) {
        results.textContent = 'None yet';
      } else {
        results.textContent = 'SHERIFF DEEDS FOUND:\\n' + found.join('\\n');
      }
    }
  </script>
</body>
</html>
